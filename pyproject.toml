[project]
name = "depth-atlas"
version = "0.17.1"
requires-python = ">=3.10,<3.13"
# Keep runtime pins identical to requirements.txt for pip and Vercel uv installs.
dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "click==8.5.0",
  "exceptiongroup==1.3.1",
  "fastapi==0.141.1",
  "h11==0.16.0",
  "idna==3.20",
  "pydantic==2.13.5",
  "pydantic_core==2.46.5",
  "starlette==1.6.0",
  "typing-inspection==0.4.4",
  "typing_extensions==4.16.0",
  "uvicorn==0.53.0",
  "certifi==2026.7.22",
  "cftime==1.6.5",
  "netCDF4==1.7.4",
  "numpy==2.2.6",
  "gsw==3.6.20",
]

[tool.uv]
package = false
# Deployed server: Linux. Verified local server: Windows x64.
# Browser users have no Python, operating-system or architecture requirement.
environments = ["sys_platform == 'linux'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]
